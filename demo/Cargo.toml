# A local stage for trying deadhop lnaddr without a Lightning node: an
# in-process Nostr relay and a fake LND that signs real regtest invoices.
# Not part of the shipped binaries. Run the real lnaddr-node and
# lnaddr-gateway against it (see README.md).
[package]
name = "lnaddr-demo"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
base64 = "0.22"
lightning-invoice = "0.33"
nostr-relay-builder = "0.44"
nostr-sdk = "0.44"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
